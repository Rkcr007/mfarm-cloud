# MFARM production data tier — durable Postgres plus automatic backups.
#
# THIS IS NOT `apps/api/docker-compose.yml`. That one mounts the data directory on tmpfs and is
# correct for what it does: tests want the fsync cost out of their concurrency measurements, and
# every run starts from nothing. Using it for the farm would lose every session, device, artifact
# and metering row on reboot, silently, and only tell you about it afterwards.
#
# Start:   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
# Migrate: DATABASE_URL=... npm --prefix apps/api run migrate
#
# WHAT THIS GIVES YOU, STATED PLAINLY:
#   * the data survives reboots, `docker compose down`, and container replacement
#   * data-checksums, so silent corruption is detected rather than served
#   * a logical backup every BACKUP_INTERVAL_SECONDS, verified after it is written
#   * an RPO equal to that interval — see the note on PITR below
#
# WHAT IT DOES NOT GIVE YOU:
#   * point-in-time recovery. There is no WAL archiving here, so the most you can lose is one
#     backup interval. For a two-device farm that is a proportionate trade; if the farm's history
#     becomes something you would miss by the hour, add WAL-G or pgBackRest and revisit.
#   * off-box copies. A backup on the same disk as the database survives a bad migration, not a
#     dead disk. `deploy/README.md` covers pushing them somewhere else.

name: mfarm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env — never the dev default}
      POSTGRES_DB: ${POSTGRES_DB:-mfarm}
      # Checksums can ONLY be enabled at initdb time. Adding them later means dumping and reloading
      # the whole cluster, so it is set now even though nothing has gone wrong yet.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # Bound to loopback, never 0.0.0.0. Reachability comes from Tailscale terminating on this host;
    # publishing 5432 to the internet would expose the database to the world the first time someone
    # relaxed a firewall rule. Change this and you have changed the security model.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The default 64MB is not enough for parallel query and index builds; the symptom is an
    # "unexpected EOF" that reads like a network fault.
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  backup:
    # Deliberately the SAME image as the server. pg_dump refuses to dump a server newer than itself,
    # so a mismatched client is a backup that stops working at the next Postgres upgrade — and
    # announces it only when you next try to back up.
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:-mfarm}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}   # 6h
      BACKUP_KEEP: ${BACKUP_KEEP:-28}
      BACKUP_DIR: /backups
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    # A plain loop rather than cron: it needs no crontab in the image, it logs to the same place as
    # everything else, and `restart: unless-stopped` already gives it supervision.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[backup] every $${BACKUP_INTERVAL_SECONDS}s, keeping $${BACKUP_KEEP}, into $${BACKUP_DIR}"
        while true; do
          /usr/local/bin/backup.sh || echo "[backup] FAILED — see above"
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # One-shot. Runs to completion, exits, and the API waits for it — so the schema is never behind the
  # code that assumes it. `restart: "no"` matters: a migration that fails must stay failed and visible
  # rather than looping, because the second attempt of a half-applied migration is rarely better than
  # the first.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: mfarm-api:${MFARM_VERSION:-latest}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The OWNER connection, and only here. Migrations create tables and own them; request handling
      # must never use this URL — see the api service below and `db.ts`.
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-mfarm}
    command: ["node", "apps/api/scripts/migrate.mjs"]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: mfarm-api:${MFARM_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0            # inside the container only; the published port is loopback-bound below
      # TWO ROLES, TWO URLS — the single most dangerous thing in this repo to get wrong.
      # `mfarm_app` is non-superuser, has no BYPASSRLS and owns nothing, so row-level security is
      # real on this connection. config.ts exits 78 if these two ever converge, because request
      # handling that runs as the owner bypasses RLS while every policy still reads as enabled.
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-mfarm}
      APP_DATABASE_URL: postgres://mfarm_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD and ALTER ROLE mfarm_app to match}@postgres:5432/${POSTGRES_DB:-mfarm}
      REAPER_INTERVAL_MS: ${REAPER_INTERVAL_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # A SECOND listener, on its own port. Everything it serves is fleet-wide and collected on the
      # OWNER pool — RLS would hide it otherwise — so it must never share the listener that carries
      # the WebDriver hub. 0.0.0.0 is inside the container only, so that `prometheus` can reach it
      # across the compose network; `config.ts` refuses that combination in production without a
      # token, which is the point.
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: 9464
      # The console's session cookie carries `Secure` by default in production, which is right for
      # both intended routes: `tailscale serve` puts real HTTPS in front, and a tunnel to
      # http://localhost:3000 is a SECURE CONTEXT as far as every browser is concerned, so the
      # cookie is stored there too.
      #
      # Set this to 0 for the one route that breaks — reaching the API over plain HTTP on a tailnet
      # or LAN address, which needs the port re-published as well. The failure it causes is quiet
      # rather than loud: the browser refuses to store the cookie, login returns 200, and the next
      # request is anonymous, so it looks like signing in does nothing at all.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
    secrets:
      - session_signing_key
      - session_public_key
      - worker_registration_token
      - metrics_token
    ports:
      # Loopback only, exactly like Postgres. Tailscale is what makes this reachable; publishing on
      # 0.0.0.0 would put the control plane on the internet the first time a firewall rule relaxed.
      - "127.0.0.1:${API_PORT:-3000}:3000"
      # Published so `curl -H "Authorization: Bearer $(cat deploy/secrets/metrics_token)"
      # 127.0.0.1:9464/metrics` works from the host without Prometheus. Loopback, and behind the
      # token either way.
      - "127.0.0.1:${METRICS_PORT:-9464}:9464"
    # The signing key is a multi-line PEM, and compose .env files cannot hold multi-line values. So
    # the secrets arrive as files and are read into the environment here, immediately before exec.
    # They never appear in deploy/.env, in `docker inspect`, or in the compose config output.
    #
    # `exec` so node replaces the shell and becomes the process tini signals — without it SIGTERM
    # reaches sh, node never drains, and in-flight requests are cut off mid-response.
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        SESSION_SIGNING_KEY="$$(cat /run/secrets/session_signing_key)"; export SESSION_SIGNING_KEY
        SESSION_PUBLIC_KEY="$$(cat /run/secrets/session_public_key)"; export SESSION_PUBLIC_KEY
        WORKER_REGISTRATION_TOKEN="$$(cat /run/secrets/worker_registration_token)"; export WORKER_REGISTRATION_TOKEN
        METRICS_TOKEN="$$(cat /run/secrets/metrics_token)"; export METRICS_TOKEN
        exec node --experimental-strip-types apps/api/src/main.ts
    healthcheck:
      # /health is LIVENESS: no I/O, never fails while the process lives. Deliberately not /ready,
      # which touches both pools — a DB-touching liveness check turns a brief database blip into a
      # restart loop that outlasts it.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

secrets:
  session_signing_key:
    file: ./secrets/session_signing_key.pem
  session_public_key:
    file: ./secrets/session_public_key.pem
  worker_registration_token:
    file: ./secrets/worker_registration_token
  # Read by the API (to require it) and by Prometheus (to present it). One file, two consumers, so
  # the two cannot drift into a scrape that 401s forever while every dashboard reads "No data".
  metrics_token:
    file: ./secrets/metrics_token

volumes:
  pgdata:
    # Named, not bind-mounted: `docker compose down` leaves it alone. Note that `down -v` does NOT —
    # that flag is what the test stack uses on purpose, and it is the one command to keep away from
    # this file.
    name: mfarm_pgdata

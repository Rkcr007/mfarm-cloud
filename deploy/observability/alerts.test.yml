# Unit tests for the alert rules — `promtool test rules`.
#
# WHY THIS FILE EXISTS. CI already runs `promtool check rules`, and that checks SYNTAX: the YAML
# parses and the expressions are valid PromQL. It does not evaluate anything. A rule that watches
# `mfarm_backup_age_second` — singular, a typo — passes that check and then never fires, for ever,
# and a farm whose backups stopped six weeks ago looks exactly like a farm whose backups are fine.
#
# That is this repo's own rule about assertions that cannot come out both ways, applied to alerting:
# a rule nobody has seen fire is not an alert, it is a hope. Every test below therefore asserts BOTH
# directions — the condition that must page, and the neighbouring condition that must stay quiet.
#
# Run locally:
#   docker run --rm -v "$PWD:/work" -w /work --entrypoint promtool prom/prometheus:v2.55.1 \
#     test rules deploy/observability/alerts.test.yml

rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # -------------------------------------------------------------------------------------------
  # THE HEALTHY FARM. Pinned to numbers measured on the live control plane on 2026-09-03:
  #
  #   mfarm_backup_age_seconds          3620
  #   mfarm_backup_offsite_age_seconds    13
  #
  # This is the most important test in the file and the easiest one to leave out. Without it, every
  # threshold below could be off by an order of magnitude and the tests would still pass — they
  # would just be asserting that a rule fires for a farm that is fine.
  # -------------------------------------------------------------------------------------------
  - interval: 1m
    name: a healthy farm pages nobody
    input_series:
      - series: 'mfarm_backup_age_seconds'
        values: '3620+60x120'
      # A SAWTOOTH, not a ramp. The uploader confirms every 15m and rewrites the receipt, so on a
        # healthy farm this climbs to ~900s and drops back — it never grows without bound. Modelling
        # it as a ramp (the first version of this test) made it cross 3600 after an hour and fail a
        # rule that was behaving correctly.
      - series: 'mfarm_backup_offsite_age_seconds'
        values: '13+60x14 13+60x14 13+60x14 13+60x14 13+60x14 13+60x14 13+60x14 13+60x14'
    alert_rule_test:
      - eval_time: 2h
        alertname: MfarmBackupStale
        exp_alerts: []
      - eval_time: 2h
        alertname: MfarmBackupUnreadable
        exp_alerts: []
      - eval_time: 2h
        alertname: MfarmBackupNotOffsite
        exp_alerts: []
      - eval_time: 2h
        alertname: MfarmBackupOffsiteUnconfirmed
        exp_alerts: []

  # -------------------------------------------------------------------------------------------
  # BACKUPS HAVE STOPPED. The threshold is 46800s (13h) — two missed 6-hourly runs.
  # -------------------------------------------------------------------------------------------
  - interval: 1m
    name: 'a backup that stopped pages, and only after the for: window'
    input_series:
      - series: 'mfarm_backup_age_seconds'
        values: '46900x120'
    alert_rule_test:
      # `for: 15m`. At 10m the condition holds but the alert is pending, not firing — which is the
      # half that stops a slow dump from paging anyone.
      - eval_time: 10m
        alertname: MfarmBackupStale
        exp_alerts: []
      - eval_time: 20m
        alertname: MfarmBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 'No database backup has been written for 13h 1m 40s'
              description: >-
                Measured from the newest `mfarm-*.dump` on disk, not from the sidecar claiming success — a crashed sidecar reports nothing at all, which is indistinguishable from one that was never asked. Check `docker compose -f deploy/docker-compose.prod.yml logs backup`. Losing pgdata loses the fleet; the app store and artifacts are reproducible, this is not.

  - interval: 1m
    name: one slow dump is not an incident
    input_series:
      # 12h — inside the 13h budget. A single 6-hourly run that ran long, or a restart.
      - series: 'mfarm_backup_age_seconds'
        values: '43200x120'
    alert_rule_test:
      - eval_time: 2h
        alertname: MfarmBackupStale
        exp_alerts: []

  # -------------------------------------------------------------------------------------------
  # THE MOUNT IS GONE. -1 means the API cannot read BACKUP_DIR at all.
  #
  # The rules deliberately separate this from staleness, and this test is what holds them apart: a
  # -1 reported as "very old backups" sends whoever is paged to inspect a sidecar that is working
  # perfectly, while the actual fault is a `:ro` bind mount on the api service.
  # -------------------------------------------------------------------------------------------
  - interval: 1m
    name: an unreadable backup directory is its own alert, not a stale one
    input_series:
      - series: 'mfarm_backup_age_seconds'
        values: '-1x120'
    alert_rule_test:
      - eval_time: 20m
        alertname: MfarmBackupUnreadable
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The control plane cannot see the backup directory
              description: >-
                BACKUP_DIR is unset, unmounted or unreadable from the API container, so backup freshness is UNMEASURED — not proven bad, but not proven good either, which is the same thing when it comes to backups. Check the `:ro` bind mount on the api service.
      # THE POINT OF THE SEPARATION: -1 must not also read as "the backups are ancient".
      - eval_time: 20m
        alertname: MfarmBackupStale
        exp_alerts: []

  # -------------------------------------------------------------------------------------------
  # FRESH LOCAL BACKUPS, NONE OF THEM OFF THE BOX.
  #
  # The dangerous state, and the one that looks healthiest on a dashboard: dumps are being written,
  # verified and retained, every one of them on the same disk as the database they protect.
  # -------------------------------------------------------------------------------------------
  - interval: 1m
    name: healthy local backups still page when nothing has left the machine
    input_series:
      - series: 'mfarm_backup_age_seconds'
        values: '600x120'
      - series: 'mfarm_backup_offsite_age_seconds'
        values: '4000x120'
    alert_rule_test:
      - eval_time: 20m
        alertname: MfarmBackupNotOffsite
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 'The newest backup has not been confirmed off this machine for 1h 6m 40s'
              description: >-
                Local backups may be perfectly healthy — check MfarmBackupStale for that. This says the newest dump has not been seen in the bucket, so a lost VM or a lost disk is a lost farm. Usually the service account has lost storage.objects.create on the bucket, or the bucket name changed. Check `docker compose -f deploy/docker-compose.prod.yml logs backup-offsite`.
      # The local backups are fine, and must not be reported as a problem alongside it.
      - eval_time: 20m
        alertname: MfarmBackupStale
        exp_alerts: []

  # -------------------------------------------------------------------------------------------
  # NOTHING HAS EVER LEFT THE BOX. -1 is "no receipt was ever written".
  #
  # This is also what BACKUP_BUCKET=none produces, on purpose: accepting single-disk backups should
  # require silencing an alert that is telling the truth.
  # -------------------------------------------------------------------------------------------
  - interval: 1m
    name: a farm that has never uploaded a backup says so, distinctly
    input_series:
      - series: 'mfarm_backup_offsite_age_seconds'
        values: '-1x120'
    alert_rule_test:
      # `for: 30m` here, longer than the others — an uploader that has not run yet on a fresh farm
      # should not page during setup.
      - eval_time: 20m
        alertname: MfarmBackupOffsiteUnconfirmed
        exp_alerts: []
      - eval_time: 40m
        alertname: MfarmBackupOffsiteUnconfirmed
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: No backup has ever been confirmed off this machine
              description: >-
                There is no `.offsite-receipt` in BACKUP_DIR, so nothing has ever been proven to leave this disk. Either backup-offsite has never succeeded — see its logs, and deploy/README.md for the two IAM commands it needs — or BACKUP_BUCKET is deliberately `none`, in which case silence this alert explicitly so the choice is visible to whoever inherits it.
      # -1 is not a large number: "never uploaded" must not also fire "the upload is overdue", or
      # one misconfigured farm produces two pages saying different things about one fact.
      - eval_time: 40m
        alertname: MfarmBackupNotOffsite
        exp_alerts: []

  # -------------------------------------------------------------------------------------------
  # A SILENT HOST — and the severity is the assertion that matters here.
  #
  # `mfarm-lab` is stopped between sessions on purpose, so this rule fires for long stretches during
  # normal operation. At `critical` the Alertmanager route repeats hourly, which would page for ever
  # about a deliberate choice. The severity was lowered to `warning` on 2026-09-03 and this test is
  # what stops it drifting back without someone deciding to.
  #
  # The gauge is a TIMESTAMP, not an age, which is what makes the test series read oddly: a healthy
  # host's heartbeat advances in step with the clock, so `time() - heartbeat` stays flat near zero.
  # -------------------------------------------------------------------------------------------
  - interval: 1m
    name: a host that stops heartbeating is a warning, not a page
    input_series:
      # Frozen at 0 while the clock advances — the shape of a host that went away and said nothing.
      - series: 'mfarm_host_last_heartbeat_timestamp_seconds{hostname="mfarm-lab", region="asia-south1"}'
        values: '0x10'
    alert_rule_test:
      # 60s threshold plus `for: 1m`, so nothing at one minute.
      - eval_time: 1m
        alertname: MfarmHostSilent
        exp_alerts: []
      - eval_time: 3m
        alertname: MfarmHostSilent
        exp_alerts:
          - exp_labels:
              severity: warning
              hostname: mfarm-lab
              region: asia-south1
            exp_annotations:
              summary: 'Worker host mfarm-lab has stopped heartbeating'
              description: >-
                No heartbeat for over a minute from mfarm-lab (asia-south1). Its devices are still in whatever state they were last reported in, which means the control plane's view of them is now fiction.

  - interval: 1m
    name: a host heartbeating normally is silent in the alerting sense
    input_series:
      # Advancing 60s per minute — the heartbeat keeps pace with the clock, so the difference stays 0.
      - series: 'mfarm_host_last_heartbeat_timestamp_seconds{hostname="mfarm-lab", region="asia-south1"}'
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: MfarmHostSilent
        exp_alerts: []

  # -------------------------------------------------------------------------------------------
  # A RECOVERY THE REAPER SHOULD HAVE ENDED (ADR-0024).
  #
  # The threshold is 900s against a RECOVERY_TIMEOUT_MS of 600s, and the gap is the whole design:
  # the reaper expires a recovery at 600s, so this gauge cannot legitimately reach 900 — reaching it
  # means the sweep has stopped. The second test is the one that keeps that honest, because a
  # threshold below the timeout would fire on every ordinary slow recovery and teach people to
  # ignore it.
  # -------------------------------------------------------------------------------------------
  - interval: 1m
    name: a recovery the reaper never ended pages
    input_series:
      - series: 'mfarm_device_preparing_age_seconds_max'
        values: '901x30'
    alert_rule_test:
      # `for: 5m`, so nothing at four minutes.
      - eval_time: 4m
        alertname: MfarmDeviceRecoveryStuck
        exp_alerts: []
      - eval_time: 8m
        alertname: MfarmDeviceRecoveryStuck
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: A quarantine recovery has outlived the timeout that should have ended it
              description: >-
                A device released from quarantine has been PREPARING for longer than RECOVERY_TIMEOUT_MS plus a wide margin. The reaper should have expired it and put it back in quarantine, so this means the reaper is not running rather than that the device is slow. Check the API container's log for [reaper] lines.

  - interval: 1m
    name: an ordinary recovery, and one the reaper ends on time, page nobody
    input_series:
      # Climbs the way a real recovery does — a powerwash is 40-80s, an Appium restart adds more —
      # and then the reaper expires it at the 600s timeout and the gauge drops to zero.
      - series: 'mfarm_device_preparing_age_seconds_max'
        values: '0+60x10 0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: MfarmDeviceRecoveryStuck
        exp_alerts: []

  # -------------------------------------------------------------------------------------------
  # THE AUTO-DEPLOYER, HEALTHY. A tick every five minutes, the farm up to date, nothing blocked.
  #
  # This is the case that matters most and the one easiest to omit: without it, every threshold
  # below could be an order of magnitude wrong and the tests would still pass — they would simply be
  # asserting that the rules fire on a farm that is fine, which is how an alert gets silenced.
  #
  # `check_age` is a SAWTOOTH, not a ramp. The timer fires every 5m and rewrites `last-check`, so on
  # a healthy farm this climbs to ~300s and drops back; modelling it as a ramp would cross the
  # 1800s threshold after half an hour and fail a deployer that is working perfectly.
  # -------------------------------------------------------------------------------------------
  - interval: 1m
    name: a working deployer pages nobody
    input_series:
      - series: 'mfarm_autodeploy_check_age_seconds'
        values: '0+60x4 0+60x4 0+60x4 0+60x4 0+60x4 0+60x4 0+60x4 0+60x4 0+60x4 0+60x4 0+60x4 0+60x4'
      - series: 'mfarm_autodeploy_pending_seconds'
        values: '0x120'
      - series: 'mfarm_autodeploy_blocked'
        values: '0x120'
    alert_rule_test:
      - eval_time: 1h
        alertname: MfarmDeployBlocked
        exp_alerts: []
      - eval_time: 1h
        alertname: MfarmDeployerNotRunning
        exp_alerts: []
      - eval_time: 1h
        alertname: MfarmFarmBehindMain
        exp_alerts: []

  # -------------------------------------------------------------------------------------------
  # A COMMIT FAILED ITS HEALTH GATE. The farm is running older code than main and the deployer has
  # correctly stopped — which is safe only because this pages.
  # -------------------------------------------------------------------------------------------
  - interval: 1m
    name: a blocked commit pages
    input_series:
      - series: 'mfarm_autodeploy_blocked'
        values: '0x10 1x50'
      - series: 'mfarm_autodeploy_check_age_seconds'
        values: '60x60'
    alert_rule_test:
      # Not at the moment it happens — `for: 5m`, so a single scrape cannot page.
      - eval_time: 12m
        alertname: MfarmDeployBlocked
        exp_alerts: []
      - eval_time: 20m
        alertname: MfarmDeployBlocked
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: A commit failed its health gate and the farm will not self-deploy
              description: >-
                The auto-deployer put a commit into service, it did not stay ready, and the image was rolled back. It will not be retried — that refusal is what stops one bad merge becoming a restart loop, and it also means NOTHING will bring this farm forward until a human looks. Read ~/autodeploy.log, then either fix main or clear deploy/.state/autodeploy/failed-sha. NOTE: the image rolled back, the SCHEMA did not.
      # THE OTHER DIRECTION, and the reason this is a test rather than a hope: a healthy deployer
      # reports 0 and an unreadable one reports -1, and NEITHER is a blocked deploy. `> 0` instead
      # of `== 1` would be silent on the first and correct on the second, which is the wrong way
      # round; a rule that pages when it cannot see is MfarmDeployerNotRunning's job.
      - eval_time: 20m
        alertname: MfarmDeployerNotRunning
        exp_alerts: []

  # -------------------------------------------------------------------------------------------
  # THE TIMER IS DEAD, and separately, THE STATE CANNOT BE READ. Both mean nothing is bringing this
  # farm forward, so both must page — and a -1 must NOT be mistaken for a blocked deploy.
  # -------------------------------------------------------------------------------------------
  - interval: 1m
    name: a dead timer and an unreadable state both page, and neither reads as blocked
    input_series:
      - series: 'mfarm_autodeploy_check_age_seconds'
        values: '0+60x120'
      - series: 'mfarm_autodeploy_blocked'
        values: '0x120'
    alert_rule_test:
      - eval_time: 25m
        alertname: MfarmDeployerNotRunning
        exp_alerts: []
      - eval_time: 45m
        alertname: MfarmDeployerNotRunning
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The auto-deploy timer has not run
              description: >-
                No completed auto-deploy tick for over half an hour (it runs every five minutes), or its state cannot be read at all. Check `systemctl status mfarm-autodeploy.timer` and that deploy/.state/autodeploy is writable by the checkout's owner — docker creates a missing bind-mount source as root, which produces a timer that ticks and records nothing.

  - interval: 1m
    name: an unreadable deploy state pages as a dead timer, not as a blocked commit
    input_series:
      - series: 'mfarm_autodeploy_check_age_seconds'
        values: '-1x120'
      - series: 'mfarm_autodeploy_blocked'
        values: '-1x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: MfarmDeployerNotRunning
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The auto-deploy timer has not run
              description: >-
                No completed auto-deploy tick for over half an hour (it runs every five minutes), or its state cannot be read at all. Check `systemctl status mfarm-autodeploy.timer` and that deploy/.state/autodeploy is writable by the checkout's owner — docker creates a missing bind-mount source as root, which produces a timer that ticks and records nothing.
      # -1 IS NOT 1. This catches `!= 0`, which is the natural way to write "blocked is set" and
      # would turn every unreadable state directory into a critical page about a commit that does
      # not exist — verified by making that change and watching this case go red.
      #
      # It does NOT catch `> 0`, and the claim that it did was in this comment until it was checked.
      # Given the collector's domain of -1/0/1 the two expressions are identical, so no test can
      # separate them; `== 1` is written for the reader rather than for the rule engine.
      - eval_time: 30m
        alertname: MfarmDeployBlocked
        exp_alerts: []

  # -------------------------------------------------------------------------------------------
  # D18, AS A RULE. The farm knows it is behind main and has not caught up.
  #
  # The healthy shape is a SPIKE: pending rises for the one or two ticks between a merge and its
  # image, then returns to zero. A rule that fired on "pending > 0" would page on every merge, so
  # the test asserts the spike is quiet and the sustained gap is not.
  # -------------------------------------------------------------------------------------------
  - interval: 1m
    name: a merge does not page, but a farm left behind does
    input_series:
      - series: 'mfarm_autodeploy_pending_seconds'
        values: '0x10 60+60x9 0x100'
    alert_rule_test:
      - eval_time: 25m
        alertname: MfarmFarmBehindMain
        exp_alerts: []

  - interval: 1m
    name: half an hour behind main pages
    input_series:
      - series: 'mfarm_autodeploy_pending_seconds'
        values: '0+60x120'
    alert_rule_test:
      - eval_time: 25m
        alertname: MfarmFarmBehindMain
        exp_alerts: []
      - eval_time: 45m
        alertname: MfarmFarmBehindMain
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The farm has been behind main for half an hour
              description: >-
                origin/main has been ahead of what this farm is running for 45m 0s. Every "verified on the farm" claim made in that window was made against older code. Check ~/autodeploy.log for the verdict — `waiting` means Release never published an image, `paused` means the kill switch is still set.

  # -------------------------------------------------------------------------------------------
  # THE MACHINE. A host with plenty of disk and an unremarkable load pages nobody — the case that,
  # left out, would let every threshold below be an order of magnitude wrong and still pass.
  #
  # Pinned to the shape of `mfarm-lab`: 8 cores, a 100 GB volume.
  # -------------------------------------------------------------------------------------------
  - interval: 1m
    name: a healthy machine pages nobody
    input_series:
      - series: 'mfarm_host_disk_free_bytes{hostname="mfarm-lab",region="asia-south1"}'
        values: '64424509440x120'
      - series: 'mfarm_host_disk_total_bytes{hostname="mfarm-lab",region="asia-south1"}'
        values: '107374182400x120'
      - series: 'mfarm_host_load1{hostname="mfarm-lab",region="asia-south1"}'
        values: '3.2x120'
      - series: 'mfarm_host_cores{hostname="mfarm-lab",region="asia-south1"}'
        values: '8x120'
      - series: 'mfarm_host_stats_age_seconds{hostname="mfarm-lab",region="asia-south1"}'
        values: '10x120'
    alert_rule_test:
      - eval_time: 1h
        alertname: MfarmHostDiskLow
        exp_alerts: []
      - eval_time: 1h
        alertname: MfarmHostDiskCritical
        exp_alerts: []
      - eval_time: 1h
        alertname: MfarmHostSaturated
        exp_alerts: []
      - eval_time: 1h
        alertname: MfarmHostStatsStale
        exp_alerts: []

  # -------------------------------------------------------------------------------------------
  # A DISK FILLING UP. 8% free — under the 10% warning, over the 5% critical. Both directions
  # asserted, because a warning that also fires the critical is a rule that cannot express urgency.
  # -------------------------------------------------------------------------------------------
  - interval: 1m
    name: a filling disk warns without paging
    input_series:
      - series: 'mfarm_host_disk_free_bytes{hostname="mfarm-lab",region="asia-south1"}'
        values: '8589934592x120'
      - series: 'mfarm_host_disk_total_bytes{hostname="mfarm-lab",region="asia-south1"}'
        values: '107374182400x120'
    alert_rule_test:
      - eval_time: 20m
        alertname: MfarmHostDiskLow
        exp_alerts:
          - exp_labels:
              severity: warning
              hostname: mfarm-lab
              region: asia-south1
            exp_annotations:
              summary: 'mfarm-lab is running out of disk'
              description: >-
                Under 10% free on the volume holding the agent's working files — cvd images, snapshots and the app cache. A snapshot restore that runs out of space leaves its device in CLEANING, which surfaces as a device fault rather than as a full disk.
      - eval_time: 20m
        alertname: MfarmHostDiskCritical
        exp_alerts: []

  - interval: 1m
    name: a nearly full disk pages
    input_series:
      - series: 'mfarm_host_disk_free_bytes{hostname="mfarm-lab",region="asia-south1"}'
        values: '3221225472x120'
      - series: 'mfarm_host_disk_total_bytes{hostname="mfarm-lab",region="asia-south1"}'
        values: '107374182400x120'
    alert_rule_test:
      - eval_time: 20m
        alertname: MfarmHostDiskCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              hostname: mfarm-lab
              region: asia-south1
            exp_annotations:
              summary: 'mfarm-lab has almost no disk left'
              description: >-
                Under 5% free. Resets will start failing shortly if they have not already. Prune the app cache and old artifacts before this becomes a fleet-wide CLEANING backlog.

  # -------------------------------------------------------------------------------------------
  # A HOST THAT NEVER REPORTED. `collectFleet` emits NO series for a NULL — deliberately, because a
  # zero disk gauge reads as a full disk rather than as an unmeasured one, and zero-filling would
  # have paged for every host running an agent older than migration 044 on the first scrape.
  #
  # This is that decision, asserted from the alerting side: with no series, nothing fires.
  # -------------------------------------------------------------------------------------------
  - interval: 1m
    name: a host that never reported its machine fires nothing
    input_series:
      - series: 'mfarm_host_last_heartbeat_timestamp_seconds{hostname="old-agent",region="asia-south1"}'
        values: '0+60x120'
    alert_rule_test:
      - eval_time: 1h
        alertname: MfarmHostDiskLow
        exp_alerts: []
      - eval_time: 1h
        alertname: MfarmHostDiskCritical
        exp_alerts: []
      - eval_time: 1h
        alertname: MfarmHostStatsStale
        exp_alerts: []

  # -------------------------------------------------------------------------------------------
  # STATS THAT STOPPED. The host still beats, so nothing else notices — and the disk rules have gone
  # SILENT rather than passing, which is the failure mode that makes a metric worse than none.
  # -------------------------------------------------------------------------------------------
  - interval: 1m
    name: a host that stopped reporting its machine says so
    input_series:
      - series: 'mfarm_host_stats_age_seconds{hostname="mfarm-lab",region="asia-south1"}'
        values: '0+60x120'
    alert_rule_test:
      - eval_time: 20m
        alertname: MfarmHostStatsStale
        exp_alerts: []
      - eval_time: 40m
        alertname: MfarmHostStatsStale
        exp_alerts:
          - exp_labels:
              severity: warning
              hostname: mfarm-lab
              region: asia-south1
            exp_annotations:
              summary: 'mfarm-lab has stopped reporting machine stats'
              description: >-
                Last machine reading was 40m 0s ago, while the host is still beating. The disk and load alerts for this host are now silent — not passing.

  # -------------------------------------------------------------------------------------------
  # LOAD IS PER CORE. A load of 20 is fine on 32 cores and dire on 4, so the rule divides — and this
  # asserts both, because a threshold on the raw load average would be right for exactly one
  # machine size and this farm is about to have two.
  # -------------------------------------------------------------------------------------------
  - interval: 1m
    name: load is judged per core, not absolutely
    input_series:
      - series: 'mfarm_host_load1{hostname="big",region="asia-south1"}'
        values: '20x120'
      - series: 'mfarm_host_cores{hostname="big",region="asia-south1"}'
        values: '32x120'
      - series: 'mfarm_host_load1{hostname="small",region="asia-south1"}'
        values: '20x120'
      - series: 'mfarm_host_cores{hostname="small",region="asia-south1"}'
        values: '4x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: MfarmHostSaturated
        exp_alerts:
          - exp_labels:
              severity: warning
              hostname: small
              region: asia-south1
            exp_annotations:
              summary: 'small is CPU saturated'
              description: >-
                Load average is more than four times the core count, sustained. On this farm the host's CPU is the binding constraint on rendering — a saturated host reaches a tenant as slow frames and flaky timing assertions, not as a failure anyone can see.

  # -------------------------------------------------------------------------------------------
  # IDLE AND BILLING — and the neighbouring case that must stay quiet.
  #
  # This is the alert `STATUS.md` records as already having cost ₹230: the console has shown a
  # powered-on host since ADR-0035 and nothing ever paged about one. Both directions are asserted,
  # because the failure mode of this particular rule is the expensive one — a rule that cannot fire
  # is indistinguishable from a farm nobody left running.
  # -------------------------------------------------------------------------------------------
  - interval: 1m
    name: a host that is on with nothing allocated eventually pages
    input_series:
      - series: 'mfarm_hosts{state="UP"}'
        values: '1x240'
      - series: 'mfarm_devices{state="READY",region="asia-south1",platform="android",tier="cuttlefish"}'
        values: '4x240'
      - series: 'mfarm_devices{state="RESERVED",region="asia-south1",platform="android",tier="cuttlefish"}'
        values: '0x240'
      - series: 'mfarm_devices{state="SESSION_ACTIVE",region="asia-south1",platform="android",tier="cuttlefish"}'
        values: '0x240'
    alert_rule_test:
      # Not yet: a farm is legitimately on and idle between two suites, and a rule that fires during
      # a coffee break is one that gets silenced.
      - eval_time: 1h
        alertname: MfarmHostIdleAndBilling
        exp_alerts: []
      - eval_time: 3h
        alertname: MfarmHostIdleAndBilling
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: A device host has been powered on and unused for two hours
              description: >-
                Every host is on and not one device is allocated. A host is billed while it is POWERED ON, whether or not anything is running on it — that is the whole shape of the 2026-09-11 incident, where the farm ran for twenty hours and forty-eight minutes after a check that needed two. Stop it from the Infrastructure page, or drain it if you are keeping it for something.
              runbook: https://farm.mfarm.dev/#/infra/hosts

  # -------------------------------------------------------------------------------------------
  # A BUSY FARM MUST NOT PAGE, and neither must one that is switched off. Both are the states this
  # rule spends most of its life in, and either firing would teach somebody to ignore it.
  # -------------------------------------------------------------------------------------------
  - interval: 1m
    name: a farm that is being used, and a farm that is off, stay quiet
    input_series:
      - series: 'mfarm_hosts{state="UP"}'
        values: '1x240'
      - series: 'mfarm_devices{state="SESSION_ACTIVE",region="asia-south1",platform="android",tier="cuttlefish"}'
        values: '1x240'
    alert_rule_test:
      - eval_time: 3h
        alertname: MfarmHostIdleAndBilling
        exp_alerts: []

  - interval: 1m
    name: a farm with nothing powered on stays quiet
    input_series:
      - series: 'mfarm_hosts{state="UP"}'
        values: '0x240'
      - series: 'mfarm_devices{state="RESERVED",region="asia-south1",platform="android",tier="cuttlefish"}'
        values: '0x240'
    alert_rule_test:
      - eval_time: 3h
        alertname: MfarmHostIdleAndBilling
        exp_alerts: []

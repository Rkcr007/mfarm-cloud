# Alertmanager routing.
#
# READ THIS BEFORE ASSUMING YOU ARE ALERTED.
#
# The receiver is Slack, and the webhook is read from `/run/secrets/slack_webhook_url` — never
# written here. Alertmanager does not expand environment variables in this file, so a URL typed into
# it would sit in the repository in plaintext; `api_url_file` and `deploy/secrets/` exist precisely
# so that cannot happen by accident.
#
# **AN EMPTY OR MISSING WEBHOOK FILE IS A SILENT NON-ALERT.** Alertmanager starts, accepts alerts,
# groups them and shows them in its UI, and every notification attempt fails in the log. That looks
# identical to a quiet farm from anywhere except the log, which is the same trap as a Prometheus
# scraping nothing. After putting the webhook in place, TEST IT — the honest test is causing a real
# alert, not trusting this comment.

route:
  # Group by the alert and the thing it is about, so two devices failing produce two notifications
  # rather than one that mentions "2 alerts".
  group_by: ['alertname', 'hostname']
  # Wait this long before sending the first notification for a new group — long enough that a
  # restart which trips three rules at once arrives as one message.
  group_wait: 30s
  group_interval: 5m
  # How long before an unresolved alert is repeated. Four hours: short enough that an overnight
  # failure is still shouting in the morning, long enough not to train anyone to mute it.
  repeat_interval: 4h
  receiver: default

  routes:
    # Critical is the only severity worth waking someone for; warnings can wait for the next repeat
    # cycle and are grouped more loosely.
    - matchers: [severity="critical"]
      receiver: default
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  # If the control plane is unreachable, every device and session gauge is stale by definition.
  # Without this, one dead API produces a page for the API plus a page for each device it can no
  # longer report on — and the useful one is buried.
  - source_matchers: [alertname="MfarmControlPlaneDown"]
    target_matchers: [severity=~"critical|warning"]
    equal: ['farm']

  # A silent host cannot report its devices, so its devices going OFFLINE is the same incident.
  - source_matchers: [alertname="MfarmHostSilent"]
    target_matchers: [alertname="MfarmDeviceOffline"]
    equal: ['farm']

receivers:
  - name: default
    slack_configs:
      # The channel comes from the webhook itself — an incoming-webhook URL is bound to one channel
      # when it is created, and `channel:` here cannot override that. It is set anyway because
      # Alertmanager shows it in its own UI, and a blank one reads as "nobody knows where this goes".
      - api_url_file: /run/secrets/slack_webhook_url
        channel: '#mfarm'
        send_resolved: true

        # `.Status` first, so a recovery does not read like a fresh incident at a glance. The count
        # matters because `group_by` means one message can carry several alerts — a title naming one
        # of them while the body lists four is how people learn to distrust the channel.
        title: >-
          [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
          {{ .CommonLabels.severity | toUpper }} — {{ .CommonLabels.farm }}

        # Every alert in the group, each with the summary AND the description, because the
        # description is where every rule in alerts.yml puts the thing to actually go and do. A
        # notification that says what broke but not what to check is a notification that becomes a
        # second research task at 3am.
        # `|-` and not `>-`. A folded scalar turns every newline into a space, so the whole message
        # would arrive as one unbroken paragraph — correct YAML, unreadable Slack. The literal block
        # keeps the line breaks the template writes.
        text: |-
          {{ range .Alerts }}*{{ .Labels.alertname }}*{{ if .Labels.hostname }} ({{ .Labels.hostname }}){{ end }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

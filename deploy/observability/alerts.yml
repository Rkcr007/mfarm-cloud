# Alert rules for a two-device farm.
#
# The bar for a rule being here: it fires BEFORE a person notices, and it names something a person
# can act on. A two-device farm has no redundancy — losing one device is losing half the capacity —
# so the interesting alerts are about a device that has quietly stopped being usable, not about
# aggregate saturation.
#
# Every `expr` below is written to survive a series going to zero. Where a count can legitimately
# reach zero, the gauge is zero-filled by the exporter (see DEVICE_STATES in `metrics.ts`) rather
# than disappearing, because `== 0` cannot fire on an absent series and an alert that cannot fire is
# worse than no alert at all — it looks like coverage.

groups:
  # ------------------------------------------------------------------ is anything there at all
  - name: mfarm-availability
    rules:
      - alert: MfarmControlPlaneDown
        expr: up{job="mfarm-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: Control plane is not scrapeable
          description: >-
            The API's metrics listener has not answered for 2 minutes. Either the process is down or
            it is wedged. Nothing else in this file can fire while this is true, so treat every
            other alert as unknown rather than clear.
          runbook: docker compose -f deploy/docker-compose.prod.yml logs --tail=200 api

      - alert: MfarmMetricsStale
        expr: increase(mfarm_scrape_errors_total[10m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: Fleet gauges are stale
          description: >-
            The control plane is answering scrapes but its database query is failing, so every
            device, session and host gauge is a frozen copy of the last successful collection. This
            is deliberately not a scrape failure — a 500 would hide the process metrics too — which
            means the graphs look plausible and are not current.

      # THE ALERT `STATUS.md` SAYS ALREADY COST ₹230.
      #
      # The console has shown a powered-on host since ADR-0035 and nothing has ever paged about one.
      # On 2026-09-12 the header read "host up 3h 1m · ~₹196" for three and a half hours while nobody
      # was looking at it — the instrument worked, and the absence of a pager was the whole gap.
      #
      # BUILT FROM SERIES THAT ALREADY EXIST rather than from a new "idle" gauge, because idleness is
      # not a property of a host: it is a host being on AND nothing being allocated, and the two
      # halves are already measured separately and correctly. A dedicated gauge would be a third
      # place for the definition to drift.
      #
      # TWO HOURS, not twenty minutes. A farm is legitimately on and idle between two suites, and an
      # alert that fires during a coffee break is one that gets silenced. Two hours of a device host
      # doing nothing is roughly ₹130 on this farm and is never deliberate.
      - alert: MfarmHostIdleAndBilling
        expr: >-
          (sum(mfarm_hosts{state="UP"}) > 0)
          and
          (sum(mfarm_devices{state=~"RESERVED|SESSION_ACTIVE"}) == 0)
        for: 2h
        labels: { severity: warning }
        annotations:
          summary: A device host has been powered on and unused for two hours
          description: >-
            Every host is on and not one device is allocated. A host is billed while it is POWERED
            ON, whether or not anything is running on it — that is the whole shape of the 2026-09-11
            incident, where the farm ran for twenty hours and forty-eight minutes after a check that
            needed two. Stop it from the Infrastructure page, or drain it if you are keeping it for
            something.
          runbook: https://farm.mfarm.dev/#/infra/hosts

  # ------------------------------------------------------------------ devices
  - name: mfarm-devices
    rules:
      # The reset-failure alert. A snapshot restore takes ~3 seconds and a powerwash roughly a cold
      # boot; five minutes in CLEANING is not slow, it is failed. The device stays there BY DESIGN —
      # a device never returns to READY without a worker confirming the reset — so nothing else will
      # ever surface it. Untreated, the farm silently loses that device forever.
      - alert: MfarmDeviceResetStuck
        expr: mfarm_device_cleaning_age_seconds_max > 300
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: A device has been restoring for over five minutes
          description: >-
            Snapshot restore normally completes in seconds. A device left in CLEANING has failed its
            reset and will never return to the pool on its own. Check the worker's log for the
            restore, then walk the fallback ladder in docs/MVP_PLAN.md — powerwash_cvd, then
            stop_cvd --resume=false and relaunch.

      - alert: MfarmDeviceQuarantined
        expr: sum(mfarm_devices{state="QUARANTINED"}) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: A device is quarantined
          description: >-
            A quarantined device is drained and never scheduled. At two devices this is half the
            farm, and it does not recover by itself. Open the device in the console: it now carries
            the reason and the source, and "Release quarantine" authorises ONE recovery attempt —
            a reset plus a health check — rather than putting it back in the pool (ADR-0024).

      # A recovery that will not finish. RECOVERY_TIMEOUT_MS is 600s and the reaper quarantines the
      # device again when it elapses, so this gauge cannot legitimately climb past that — which is
      # what makes the threshold meaningful rather than a guess. It is NOT "a recovery is slow": it
      # is "the sweep that bounds recoveries has stopped", which is a control-plane fault and would
      # otherwise be invisible, because a device stuck in PREPARING looks like one being worked on.
      - alert: MfarmDeviceRecoveryStuck
        expr: mfarm_device_preparing_age_seconds_max > 900
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: A quarantine recovery has outlived the timeout that should have ended it
          description: >-
            A device released from quarantine has been PREPARING for longer than
            RECOVERY_TIMEOUT_MS plus a wide margin. The reaper should have expired it and put it
            back in quarantine, so this means the reaper is not running rather than that the device
            is slow. Check the API container's log for [reaper] lines.

      - alert: MfarmDeviceOffline
        expr: sum(mfarm_devices{state="OFFLINE"}) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: A device has not been reported by its host
          description: >-
            OFFLINE means the host has not reported the device. Five minutes is thirty missed
            heartbeats. Usually the cvd instance died; sometimes the agent did.

      # Not "no device is free" — at two devices, both being busy is a Tuesday. This is "no device
      # is even capable of being allocated", which is a different sentence: nothing is READY and
      # nothing is in use either.
      - alert: MfarmNoUsableDevice
        expr: >-
          sum(mfarm_devices{state=~"READY|RESERVED|SESSION_ACTIVE"}) == 0
          and sum(mfarm_devices_total) > 0
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: No device in the fleet is usable
          description: >-
            Every device is offline, cleaning, quarantined or evicted. The farm cannot serve a
            session, and a CI merge gate pointed at it is now failing with exit 75.

  # ------------------------------------------------------------------ hosts
  - name: mfarm-hosts
    rules:
      # The agent heartbeats every 10 seconds. 60s is six missed beats, plus a minute of `for` —
      # comfortably past a scrape gap or a restart, well short of a suite noticing.
      #
      # The gauge is a TIMESTAMP, not an age, which is what makes "registered and never heartbeated"
      # expressible: it reports 0, `time() - 0` is enormous, and this fires. An age gauge would have
      # had to invent a number for that case, and every invented number is either a false alert or a
      # silent one.
      # SEVERITY IS `warning`, NOT `critical`, AND THAT IS A STATEMENT ABOUT THIS FARM RATHER THAN
      # ABOUT THE RULE. `mfarm-lab` is deliberately stopped between sessions — it is the ~₹65/hour
      # half and there is no reason to pay it while nobody is testing — so a silent host is this
      # farm's NORMAL state, not an incident. At `critical` the Alertmanager route repeats hourly,
      # so attaching a receiver would have paged for ever about a choice somebody made on purpose,
      # and trained whoever received it to ignore the channel the backup alerts depend on.
      #
      # It stays an alert because a host that is silent when it should be running is still worth
      # seeing; it is the PRIORITY that was wrong, not the detection. Raise it back to `critical`
      # the day the farm runs continuously — and at that point add the real fix, which is a
      # maintenance silence created when the lab is stopped deliberately, so that intent is
      # expressed once rather than inferred from severity for ever.
      - alert: MfarmHostSilent
        expr: time() - mfarm_host_last_heartbeat_timestamp_seconds > 60
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: 'Worker host {{ $labels.hostname }} has stopped heartbeating'
          description: >-
            No heartbeat for over a minute from {{ $labels.hostname }} ({{ $labels.region }}). Its
            devices are still in whatever state they were last reported in, which means the control
            plane's view of them is now fiction.

  # ------------------------------------------------------------------ deploying
  #
  # D18 was ninety minutes of a released commit sitting undeployed while `docs/DEFECTS.md` claimed
  # the fixes were live. `deploy/auto-deploy.sh` (ADR-0030) closes that gap with a timer, and these
  # three rules exist because a timer that has silently stopped looks EXACTLY like a farm with
  # nothing to deploy. An automatic mechanism nobody measures is how "released" and "deployed" came
  # apart in the first place.
  - name: mfarm-deploy
    rules:
      # THE ONE THAT PAGES. Every other state here is the deployer working: `waiting` is a farm a
      # few minutes from a Release, `paused` is an operator holding it deliberately. `blocked` is
      # the farm running older code than `main` with nothing left that will fix it — the deployer
      # has correctly refused to redeploy a build that failed its health gate, and refusing is only
      # safe if somebody is told.
      #
      # `== 1` and not `> 0`: -1 means the deploy state could not be read at all, which is the next
      # rule's business and not a blocked deploy.
      - alert: MfarmDeployBlocked
        expr: mfarm_autodeploy_blocked == 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: A commit failed its health gate and the farm will not self-deploy
          description: >-
            The auto-deployer put a commit into service, it did not stay ready, and the image was
            rolled back. It will not be retried — that refusal is what stops one bad merge becoming
            a restart loop, and it also means NOTHING will bring this farm forward until a human
            looks. Read ~/autodeploy.log, then either fix main or clear
            deploy/.state/autodeploy/failed-sha. NOTE: the image rolled back, the SCHEMA did not.

      # A deployer that has stopped ticking. -1 is included deliberately: an unreadable state
      # directory and a dead timer are the same incident from the API's point of view — in both
      # cases nothing is bringing this farm forward and nobody would otherwise find out.
      - alert: MfarmDeployerNotRunning
        expr: mfarm_autodeploy_check_age_seconds > 1800 or mfarm_autodeploy_check_age_seconds == -1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: The auto-deploy timer has not run
          description: >-
            No completed auto-deploy tick for over half an hour (it runs every five minutes), or its
            state cannot be read at all. Check `systemctl status mfarm-autodeploy.timer` and that
            deploy/.state/autodeploy is writable by the checkout's owner — docker creates a missing
            bind-mount source as root, which produces a timer that ticks and records nothing.

      # D18 ITSELF, as a rule. The farm knows it is behind `main` and has not caught up. On a
      # healthy farm this sits at zero and rises for one or two ticks after each merge; half an hour
      # means a Release that never published, a fast-forward that will not apply, or a pause
      # somebody has forgotten they took.
      - alert: MfarmFarmBehindMain
        expr: mfarm_autodeploy_pending_seconds > 1800
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: The farm has been behind main for half an hour
          description: >-
            origin/main has been ahead of what this farm is running for
            {{ $value | humanizeDuration }}. Every "verified on the farm" claim made in that window
            was made against older code. Check ~/autodeploy.log for the verdict — `waiting` means
            Release never published an image, `paused` means the kill switch is still set.

  # ------------------------------------------------------------------ the machine, not the fleet
  #
  # Every other rule in this file watches devices and sessions. All of them are green on a device
  # host whose disk is 98% full — the state in which snapshot restores start failing and the farm
  # degrades in a way that reads as a DEVICE fault for as long as it takes somebody to ssh in and
  # run `df`. S7.4, migration 044.
  #
  # None of these can fire for a host that has never reported: `collectFleet` emits no series at all
  # for a NULL, deliberately, because a zero disk gauge reads as a full disk rather than as an
  # unmeasured one. Staleness is MfarmHostStatsStale's job, not a manufactured zero's.
  - name: mfarm-host
    rules:
      # The number that ends a farm. Four Cuttlefish instances, a 4 GB snapshot each, an app cache
      # `fetchApk` never prunes, and every logcat dump — on one volume.
      - alert: MfarmHostDiskLow
        expr: mfarm_host_disk_free_bytes / mfarm_host_disk_total_bytes < 0.10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: '{{ $labels.hostname }} is running out of disk'
          description: >-
            Under 10% free on the volume holding the agent's working files — cvd images, snapshots
            and the app cache. A snapshot restore that runs out of space leaves its device in
            CLEANING, which surfaces as a device fault rather than as a full disk.

      - alert: MfarmHostDiskCritical
        expr: mfarm_host_disk_free_bytes / mfarm_host_disk_total_bytes < 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: '{{ $labels.hostname }} has almost no disk left'
          description: >-
            Under 5% free. Resets will start failing shortly if they have not already. Prune the app
            cache and old artifacts before this becomes a fleet-wide CLEANING backlog.

      # A host that DID report and has stopped. Cannot fire for an agent too old to send stats —
      # that host emits no series — so this means the agent was downgraded, or its stats read is
      # failing while its beat still works. Either way the disk rules above have gone quiet without
      # anything being fixed, which is the failure mode that makes a metric worse than none.
      - alert: MfarmHostStatsStale
        expr: mfarm_host_stats_age_seconds > 900
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: '{{ $labels.hostname }} has stopped reporting machine stats'
          description: >-
            Last machine reading was {{ $value | humanizeDuration }} ago, while the host is still
            beating. The disk and load alerts for this host are now silent — not passing.

      # Load per core. `docs/RENDER_BASELINE.md` and the encode measurement that closed S5's gate
      # both concluded the host's CPU is this farm's binding constraint, and a saturated host shows
      # up to a tenant as slow frames and timing-sensitive assertions failing, never as an incident.
      - alert: MfarmHostSaturated
        expr: mfarm_host_load1 / mfarm_host_cores > 4
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: '{{ $labels.hostname }} is CPU saturated'
          description: >-
            Load average is more than four times the core count, sustained. On this farm the host's
            CPU is the binding constraint on rendering — a saturated host reaches a tenant as slow
            frames and flaky timing assertions, not as a failure anyone can see.

  # ------------------------------------------------------------------ contention
  - name: mfarm-queue
    rules:
      # At two devices, contention is the dominant user-visible problem, and queueing is the
      # designed answer to it — so the alert is on the WAIT, not on the queue existing.
      - alert: MfarmQueueWaitLong
        expr: mfarm_session_queue_oldest_seconds > 900
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Someone has been waiting a quarter of an hour for a device
          description: >-
            The oldest queued session has waited {{ $value | humanizeDuration }}. Either a session
            is holding a device longer than it should, or the farm needs a third device. Check who
            holds what before adding hardware.

      # The reaper is the only thing that expires an abandoned session and the only thing that
      # promotes a queued one. It has no caller, so nothing retries it and nothing notices it
      # stopping — the symptom is a device held forever by a client that crashed, discovered by a
      # human hours later. This is the only signal that exists for it.
      - alert: MfarmReaperNotRunning
        expr: increase(mfarm_reaper_runs_total[10m]) == 0 and up{job="mfarm-api"} == 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: The session reaper has stopped sweeping
          description: >-
            No completed reaper sweep in ten minutes while the API is up. Abandoned sessions will
            hold their devices indefinitely, queued sessions will never be promoted, and
            idempotency_keys will grow without bound. Check REAPER_INTERVAL_MS.

      - alert: MfarmReaperFailing
        expr: increase(mfarm_reaper_failures_total[15m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: The session reaper is throwing
          description: >-
            The sweep is running and failing, which looks exactly like it running successfully in
            every other signal.

  # ------------------------------------------------------------------ integrity and capacity
  - name: mfarm-integrity
    rules:
      # A host reporting usage for a session that is not on it. Migration 008 makes this harmless —
      # the paying org is derived from the session, never taken from the request — so this is not a
      # billing emergency. It IS either an agent bug or a host reaching past its own hardware, and
      # both are worth a person.
      - alert: MfarmMeteringRejected
        expr: increase(mfarm_metering_events_total{outcome="rejected"}[15m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: A worker reported usage for a session that is not on it
          description: >-
            Rejected by record_metering(). Not a billing failure — the paying org is derived from
            the session — but the agent that sent it believes something about the fleet that is not
            true.

      - alert: MfarmResetsRejected
        expr: increase(mfarm_worker_resets_total{accepted="false"}[15m]) > 3
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: Reset confirmations are being rejected
          description: >-
            A rejected reset means a stale fence or another host's device. One after a partition is
            expected. A rate of them means a worker is confirming resets for devices that have
            already moved on, and those devices are not returning to the pool.

      - alert: MfarmPgPoolSaturated
        expr: mfarm_pg_pool_connections{state="waiting"} > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Requests are queueing for a {{ $labels.pool }} database connection'
          description: >-
            Sustained waiting on the {{ $labels.pool }} pool. This is the shape every pool-exhaustion
            incident has before it becomes a timeout, and the owner pool has only five connections —
            the reaper shares them.

      - alert: MfarmApiErrors
        expr: sum(rate(mfarm_http_requests_total{status=~"5.."}[5m])) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: The control plane is returning 5xx
          description: >-
            Client errors are excluded on purpose: a 4xx is the caller's problem and a farm full of
            them is a misconfigured suite, not an incident.

      # ---------------------------------------------------------------- backups
      #
      # HANDOFF listed this as a known gap for weeks: the backup sidecar logged its failures and
      # nothing scraped it, so backups could stop and the dashboard would look identical. These two
      # rules are the difference between finding that out now and finding it out while restoring.

      - alert: MfarmBackupStale
        # The default interval is 6h. Two missed runs is a problem; one is a slow dump or a restart.
        expr: mfarm_backup_age_seconds > 46800
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: 'No database backup has been written for {{ $value | humanizeDuration }}'
          description: >-
            Measured from the newest `mfarm-*.dump` on disk, not from the sidecar claiming success —
            a crashed sidecar reports nothing at all, which is indistinguishable from one that was
            never asked. Check `docker compose -f deploy/docker-compose.prod.yml logs backup`.
            Losing pgdata loses the fleet; the app store and artifacts are reproducible, this is not.

      - alert: MfarmBackupUnreadable
        # Distinct from staleness on purpose. -1 means the API cannot see BACKUP_DIR at all, which is
        # a mount or configuration fault — reporting it as "very old backups" would send whoever is
        # paged to look at the sidecar, which is working fine.
        expr: mfarm_backup_age_seconds == -1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: The control plane cannot see the backup directory
          description: >-
            BACKUP_DIR is unset, unmounted or unreadable from the API container, so backup freshness
            is UNMEASURED — not proven bad, but not proven good either, which is the same thing when
            it comes to backups. Check the `:ro` bind mount on the api service.

      - alert: MfarmBackupNotOffsite
        # The dangerous state is not "no backups" — that alerts loudly above. It is fresh, verified,
        # retained backups sitting on the same disk as the database they protect, which looks
        # perfect on every dashboard right up until the VM is gone.
        #
        # The uploader confirms every 15m and rewrites the receipt each time, so an hour is four
        # missed runs. Deliberately tighter than MfarmBackupStale: this measures a cheap existence
        # check, not a 6-hourly dump.
        expr: mfarm_backup_offsite_age_seconds > 3600
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: 'The newest backup has not been confirmed off this machine for {{ $value | humanizeDuration }}'
          description: >-
            Local backups may be perfectly healthy — check MfarmBackupStale for that. This says the
            newest dump has not been seen in the bucket, so a lost VM or a lost disk is a lost farm.
            Usually the service account has lost storage.objects.create on the bucket, or the bucket
            name changed. Check `docker compose -f deploy/docker-compose.prod.yml logs backup-offsite`.

      - alert: MfarmBackupOffsiteUnconfirmed
        # -1 is "no receipt has ever been written", which is a different failure from a receipt that
        # has gone stale: it means the uploader has never once succeeded, or was never configured.
        # It is also what BACKUP_BUCKET=none produces, and that is intended — accepting single-disk
        # backups should require silencing an alert that is telling the truth, not a quiet default.
        expr: mfarm_backup_offsite_age_seconds == -1
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: No backup has ever been confirmed off this machine
          description: >-
            There is no `.offsite-receipt` in BACKUP_DIR, so nothing has ever been proven to leave
            this disk. Either backup-offsite has never succeeded — see its logs, and deploy/README.md
            for the two IAM commands it needs — or BACKUP_BUCKET is deliberately `none`, in which
            case silence this alert explicitly so the choice is visible to whoever inherits it.

      - alert: MfarmLiveViewHasNoAgent
        # THE CONDITION IS THE CONJUNCTION, and the second half is what makes this alertable at all.
        # `mfarm_tunnel_hosts_connected == 0` on its own is the farm's NORMAL state: the device host
        # is off between sessions by design and is 95% of the bill, so an alert on that alone would
        # fire every day, be silenced within a week, and be gone when it mattered.
        #
        # Devices READY with no tunnel is a different thing entirely, and it is invisible everywhere
        # else. The host registers, beats and reports its devices over plain HTTPS; automation and
        # the WebDriver hub keep working; every other gauge in this file stays green. The tunnel is a
        # SECOND connection, and only a live view rides it — so this fires exactly when the console
        # shows a healthy fleet and every screen is black.
        expr: mfarm_devices{state="READY"} > 0 and on() mfarm_tunnel_hosts_connected == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Devices are READY but no agent tunnel is connected — every live view is dead
          description: >-
            The fleet is healthy and unreachable for interactive use. The agent dials the control
            plane out; nothing dials it. Check `journalctl -u mfarm-worker -n50 | grep tunnel` on the
            device host, and that the API is reachable from it at CONTROL_PLANE_URL. If /dp is still
            pointed at a direct worker address (WORKER_DATA_PLANE), the live view may work anyway —
            see "Moving a device host onto the tunnel" in deploy/README.md.

      - alert: MfarmMetricSeriesDropped
        expr: mfarm_metric_series_dropped_total > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: A metric has unbounded labels
          description: >-
            The exporter refused new label combinations after hitting its per-metric cap, so some
            metric above is now reporting an incomplete picture while looking normal. Almost always
            a label that took a URL, an id or an error message.

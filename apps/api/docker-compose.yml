# TEST AND LOCAL DEV ONLY. THIS DATABASE IS NOT DURABLE.
#
# The data directory is tmpfs, so everything in it is gone when the container stops. That is
# deliberate — tests want the fsync cost out of their concurrency measurements and every run starts
# from nothing — and it is exactly wrong for anything you would miss.
#
# The farm's real database is `deploy/docker-compose.prod.yml`: named volume, data checksums,
# restart policy, and a verified backup every few hours. See `deploy/README.md`.
#
# `npm run db:down` here runs `down -v`, which destroys the volume. That is correct for this file
# and is the one command to keep away from the production one.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mfarm
      POSTGRES_PASSWORD: mfarm
      POSTGRES_DB: mfarm
    # 5433 to avoid colliding with a local Postgres on the default port
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mfarm -d mfarm"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      # tests only; keeps the fsync cost out of the concurrency measurements
      - /var/lib/postgresql/data

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mfarm
      POSTGRES_PASSWORD: mfarm
      POSTGRES_DB: mfarm
    # 5433 to avoid colliding with a local Postgres on the default port
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mfarm -d mfarm"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      # tests only; keeps the fsync cost out of the concurrency measurements
      - /var/lib/postgresql/data

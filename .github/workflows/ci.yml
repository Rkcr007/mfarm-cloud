name: CI

on:
  push:
  pull_request:

# Read-only by default. A workflow that never needs to write should not hold a token that can.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node 22, PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # -----------------------------------------------------------------------------------------
      # This replicates apps/api/docker-compose.yml, which is local-only and never runs in CI.
      # Three things must match it exactly or the suite talks to the wrong database:
      #   image  postgres:16-alpine  (same major AND same variant as local, so behaviour matches)
      #   user   mfarm / mfarm       -> becomes the superuser and schema OWNER, as in compose
      #   db     mfarm
      #   port   5433 on the host    -> compose maps 5433:5432 to dodge a local Postgres, and both
      #                                 apps/api/src/db.ts and scripts/migrate.mjs hardcode 5433 as
      #                                 their fallback. Publishing on 5433 here means the defaults
      #                                 work untouched and there is one less thing to drift.
      #
      # The image tag is intentionally a floating major: it tracks whatever compose pulls locally,
      # and "CI runs a different Postgres than my laptop" is a worse failure than a patch bump.
      # Third-party *actions* are a different story and are pinned by SHA below.
      # -----------------------------------------------------------------------------------------
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mfarm
          POSTGRES_PASSWORD: mfarm
          POSTGRES_DB: mfarm
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mfarm -d mfarm"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # -----------------------------------------------------------------------------------------
      # TWO ROLES, TWO URLS. This is the single most dangerous thing in the repo to get wrong.
      #
      # DATABASE_URL     -> mfarm, the superuser/owner. Migrations and fleet ops ONLY.
      # APP_DATABASE_URL -> mfarm_app, created by migrations/001_init.sql with plain LOGIN and no
      #                     SUPERUSER and no BYPASSRLS. Everything that serves a tenant request.
      #
      # A PostgreSQL superuser bypasses row-level security unconditionally — FORCE ROW LEVEL
      # SECURITY does not apply to them and no policy can stop them. So if APP_DATABASE_URL ever
      # pointed at `mfarm`, every RLS policy in 002_rls.sql would still read as ENABLED in the
      # catalog while enforcing nothing, and the cross-tenant isolation tests would pass green
      # against a database with isolation switched off. That is a green build certifying a
      # tenant-data breach. The "Verify Postgres role setup" step below exists to make that
      # mistake impossible to merge rather than merely unlikely.
      #
      # The passwords are the local-dev ones from 001_init.sql and docker-compose.yml. They are
      # public by construction and guard an ephemeral throwaway container; see HANDOFF.md issue 4.
      # -----------------------------------------------------------------------------------------
      DATABASE_URL: postgres://mfarm:mfarm@localhost:5433/mfarm
      APP_DATABASE_URL: postgres://mfarm_app:mfarm_app@localhost:5433/mfarm

    steps:
      # Third-party actions are pinned to a full commit SHA rather than a tag on purpose.
      # `@v7` is a mutable ref: whoever owns the action can move it to any commit at any time, and
      # every workflow trusting the tag then executes that new code with this job's token and
      # secrets. A SHA is immutable, so an upgrade becomes a reviewable diff instead of a silent
      # substitution. The trailing comment records which release the SHA was, for upgrade sanity.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # >= 22.6 is a hard requirement: the repo has no build step and relies on Node's native
          # TypeScript stripping to run .ts directly.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # `npm ci` deliberately, not `npm install`: it installs exactly the lockfile and refuses to
      # edit it, so CI cannot silently resolve a different dependency tree than the one reviewed.
      # The trade-off is that ADDING A WORKSPACE (a new apps/*, packages/* or workers/* directory)
      # requires committing a refreshed package-lock.json, or this step fails. The hint below turns
      # npm's rather opaque sync error into an actionable one.
      - name: Install dependencies
        run: |
          set -uo pipefail
          if ! npm ci; then
            echo "::error title=Lockfile out of sync::npm ci failed. If a workspace was added or a dependency changed, run 'npm install' at the repo root and commit the updated package-lock.json."
            exit 1
          fi

      # Runs as DATABASE_URL, i.e. the owner — matching the local `npm run migrate`. 001_init.sql
      # is what creates the mfarm_app role, so nothing may connect as mfarm_app before this.
      - name: Run migrations
        working-directory: apps/api
        run: npm run migrate

      # -------------------------------------------------------------------------------------
      # The guard. Everything after this point is only meaningful if these assertions hold.
      # -------------------------------------------------------------------------------------
      - name: Verify Postgres role setup (RLS is actually enforced)
        run: |
          set -euo pipefail

          if [ "${DATABASE_URL}" = "${APP_DATABASE_URL}" ]; then
            echo "::error::APP_DATABASE_URL equals DATABASE_URL. The app would connect as the superuser and RLS would be silently disabled."
            exit 1
          fi

          # (1) Catalog check, as the owner. Proves the app role has no way around RLS.
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 --no-psqlrc -q <<'SQL'
          DO $$
          DECLARE
            r  record;
            t  text;
            rs boolean;
            fs boolean;
          BEGIN
            SELECT rolsuper, rolbypassrls, rolcanlogin
              INTO r
              FROM pg_roles
             WHERE rolname = 'mfarm_app';

            IF NOT FOUND THEN
              RAISE EXCEPTION 'role mfarm_app does not exist - migrations/001_init.sql did not run';
            END IF;
            IF r.rolsuper THEN
              RAISE EXCEPTION 'mfarm_app is a SUPERUSER: it bypasses RLS unconditionally and every policy is decorative';
            END IF;
            IF r.rolbypassrls THEN
              RAISE EXCEPTION 'mfarm_app has BYPASSRLS: every policy is decorative';
            END IF;
            IF NOT r.rolcanlogin THEN
              RAISE EXCEPTION 'mfarm_app cannot log in; the app pool would fail to connect';
            END IF;

            -- ENABLE alone is not enough. Without FORCE, the table OWNER skips every policy, which
            -- is exactly how people end up believing RLS is on when it is not (see 002_rls.sql).
            FOREACH t IN ARRAY ARRAY['orgs','memberships','api_keys','devices','sessions','metering_events','app_builds','app_actions','agent_enrollments']
            LOOP
              SELECT relrowsecurity, relforcerowsecurity
                INTO rs, fs
                FROM pg_class
               WHERE oid = format('public.%I', t)::regclass;

              IF NOT rs THEN RAISE EXCEPTION 'table % does not have ROW LEVEL SECURITY enabled', t; END IF;
              IF NOT fs THEN RAISE EXCEPTION 'table % does not have FORCE ROW LEVEL SECURITY', t; END IF;
            END LOOP;

            -- The app role must not be able to WRITE THE OUTCOME of an install. RLS keeps a tenant
            -- inside its own org and says nothing about which columns it may change, so without a
            -- REVOKE any API key could mark its own install INSTALLED or rewrite the error a failed
            -- one reported. This is not hypothetical: 001's ALTER DEFAULT PRIVILEGES grants the
            -- full set on every table the owner creates from then on, so migration 014 arrived with
            -- exactly that privilege until it revoked it. Silent, and invisible in the policy list.
            -- A bootstrap credential the tenant pool can WRITE is a bootstrap credential a tenant
            -- can mint for itself, un-expire, or un-revoke — and redeeming one stamps an org onto
            -- a host. Same ALTER DEFAULT PRIVILEGES trap as below; migration 023 revokes it.
            IF has_table_privilege('mfarm_app', 'agent_enrollments', 'INSERT')
               OR has_table_privilege('mfarm_app', 'agent_enrollments', 'UPDATE')
               OR has_table_privilege('mfarm_app', 'agent_enrollments', 'DELETE') THEN
              RAISE EXCEPTION
                'mfarm_app can write agent_enrollments. Enrollments are minted and redeemed on the system pool only; revoke it (see 023_agent_enrollment.sql).';
            END IF;

            IF has_table_privilege('mfarm_app', 'app_actions', 'UPDATE')
               OR has_table_privilege('mfarm_app', 'app_actions', 'DELETE') THEN
              RAISE EXCEPTION
                'mfarm_app can UPDATE or DELETE app_actions. Action outcomes are written by the worker path on the owner pool only; revoke it (see 014_app_library.sql and 015_app_actions.sql).';
            END IF;

            RAISE NOTICE 'mfarm_app: no superuser, no bypassrls; 8 tenant tables ENABLE+FORCE RLS; install outcomes not tenant-writable';
          END $$;
          SQL

          # (2) Live check, connecting the way the app actually connects. `is_superuser` is the
          #     discriminating signal here: it is the one thing that would still report `on` if
          #     APP_DATABASE_URL had been pointed at the owner, on an otherwise empty database
          #     where a row-count check would look identical either way.
          psql "${APP_DATABASE_URL}" -v ON_ERROR_STOP=1 --no-psqlrc -q <<'SQL'
          DO $$
          BEGIN
            IF current_user <> 'mfarm_app' THEN
              RAISE EXCEPTION 'APP_DATABASE_URL connects as %, expected mfarm_app', current_user;
            END IF;
            IF current_setting('is_superuser') <> 'off' THEN
              RAISE EXCEPTION 'the app connection is a superuser; RLS is not being enforced';
            END IF;
            IF current_org() IS NOT NULL THEN
              RAISE EXCEPTION 'app.org_id leaked onto a fresh connection: expected NULL, got %', current_org();
            END IF;
            RAISE NOTICE 'app connection verified: mfarm_app, is_superuser=off, current_org()=NULL';
          END $$;
          SQL

          # (3) SECURITY DEFINER reach. RLS says nothing about these — a definer function runs as the
          #     owner and every policy is off inside it, so the only thing standing between request
          #     handling and a fleet-wide mutation is the EXECUTE grant. Postgres grants EXECUTE to
          #     PUBLIC by default, which means a new definer function is reachable from the app pool
          #     unless a migration says otherwise; forgetting that REVOKE is silent, and this is what
          #     catches it (see migrations/008_scope_worker_mutations.sql).
          psql "${APP_DATABASE_URL}" -v ON_ERROR_STOP=1 --no-psqlrc -q <<'SQL'
          DO $$
          DECLARE fn text;
          BEGIN
            FOREACH fn IN ARRAY ARRAY[
              'expire_sessions()',
              'promote_queued(integer)',
              'quarantine_host(uuid,text,text)',
              'clear_silence_quarantine(uuid)',
              'device_reset_complete(uuid,uuid,bigint)',
              'session_attach(uuid,uuid,bigint)',
              'record_metering(uuid,uuid[],uuid[],uuid[],text[],numeric[],timestamptz[])'
            ]
            LOOP
              IF has_function_privilege('mfarm_app', fn, 'EXECUTE') THEN
                RAISE EXCEPTION
                  'mfarm_app can EXECUTE %, a fleet-wide SECURITY DEFINER function. It is called on the system pool; revoke it.', fn;
              END IF;
            END LOOP;
            RAISE NOTICE 'fleet-wide definer functions are unreachable from the app pool';
          END $$;

          -- (4) No SECURITY DEFINER function may be owned by a superuser, and none may be
          -- EXECUTE-able by PUBLIC.
          --
          -- Both are properties Postgres gives you by default and neither announces itself.
          -- A definer function executes as its OWNER, so one owned by the cluster superuser turns
          -- any future bug in it into superuser execution rather than a bounded allocator bug.
          -- And EXECUTE is granted to PUBLIC on every new function, so an explicit
          -- `GRANT ... TO mfarm_app` is decorative until PUBLIC is revoked — which is exactly how
          -- migration 008 left the three tenant-facing functions until 012 closed them.
          --
          -- Checked here because both regress by omission: adding a function and forgetting two
          -- lines looks identical to adding one correctly.
          DO $$
          DECLARE r record; bad int := 0;
          BEGIN
            FOR r IN
              SELECT p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')' AS fn,
                     pg_get_userbyid(p.proowner) AS owner,
                     ro.rolsuper AS owner_is_super,
                     has_function_privilege('public', p.oid, 'EXECUTE') AS public_can_execute
                FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
                JOIN pg_roles ro ON ro.oid = p.proowner
               WHERE n.nspname = 'public' AND p.prosecdef
            LOOP
              IF r.owner_is_super THEN
                RAISE WARNING 'SECURITY DEFINER % is owned by superuser % — it executes as one.', r.fn, r.owner;
                bad := bad + 1;
              END IF;
              IF r.public_can_execute THEN
                RAISE WARNING 'SECURITY DEFINER % is EXECUTE-able by PUBLIC; the explicit grants are decorative.', r.fn;
                bad := bad + 1;
              END IF;
            END LOOP;
            IF bad > 0 THEN
              RAISE EXCEPTION '% SECURITY DEFINER ownership/PUBLIC problem(s); see warnings above.', bad;
            END IF;
            RAISE NOTICE 'definer functions: non-superuser owner, no PUBLIC execute';
          END $$;
          SQL

          echo "RLS enforcement verified."

      # BEFORE the tests, because the API's allowlist test serves `/app/*` and those files do not
      # exist until this runs. `apps/api/public/app/` is gitignored on purpose — a committed build
      # artifact goes stale the first time somebody edits a component and forgets to rebuild — so
      # this step is what puts the console on disk for both the tests and, separately, the image.
      #
      # It is also the only thing that typechecks the console: `npm run typecheck` at the root does
      # not reach it, because the console has its own tsconfig and its own compiler options.
      - name: Build the console
        run: npm run build --workspace apps/console

      # Deliberately three separate steps rather than one `&&` chain: on a red build the step name
      # in the UI should already say whether it was the console, the schema, the tests, or the types.
      - name: Run tests
        run: npm test

      # tsc --noEmit is the ONLY thing that checks types in this repo. Node strips them without
      # looking at them, so a wrong field name runs fine until the branch that touches it.
      - name: Typecheck
        run: npm run typecheck

      # ---------------------------------------------------------------------------------------
      # Proves the RECOVERY path, not just the code. deploy/backup.sh and deploy/restore.sh are
      # shell scripts that no unit test touches, and the failure they guard against is silent:
      # backups that have been producing unusable archives for weeks, discovered on the one day
      # it matters.
      #
      # The drill seeds a scratch database with rows, an RLS policy and a granted role, backs it
      # up with the real script, DROPS the database and the role, restores with the real script,
      # and then checks that the rows, the checksum, RLS + FORCE, the policy and the grants all
      # survived. Two of those — cluster roles and privileges — are exactly what a naive
      # dump/restore loses, and losing them here would mean an app that cannot read its own data
      # or, worse, one "fixed" with a broad GRANT that undoes migration 002.
      #
      # It runs against the service container above and never touches the suite's own database.
      # ---------------------------------------------------------------------------------------
      - name: Backup/restore drill
        run: ./deploy/restore-drill.sh

  # ---------------------------------------------------------------------------------------------
  # Alert rules are configuration that only executes in production, on the day something is already
  # wrong. A typo in a PromQL expression is not a syntax error anywhere else in this repo's tooling:
  # `promtool` is the only thing that reads it, Prometheus loads the file at startup, and a rule
  # that failed to parse is a rule that silently does not exist. The failure mode is "the alert we
  # wrote never fired", discovered by the outage it was supposed to catch.
  #
  # Runs in the Prometheus image itself so the checker is always the same version as the server.
  # ---------------------------------------------------------------------------------------------
  promtool:
    name: Alert rules and scrape config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # NOT `container:` any more, and the reason is worth keeping. Running the whole job inside
    # prom/prometheus meant GitHub had to execute its own JavaScript actions in that image, and when
    # the runner moved to node24 every step died before reaching promtool with
    # `exec /__e/node24/bin/node: no such file or directory`. The image is Prometheus's to build,
    # not ours to keep in step with GitHub's runtime. So the job runs on the normal runner and calls
    # promtool through docker, where the only contract is a file path.
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check rules and config
        run: |
          set -eu
          # `check config` resolves rule_files and credentials_file against absolute paths that only
          # exist inside the running container, so stage both where the config expects them and
          # mount the staging directory at those paths.
          mkdir -p ci-prometheus ci-secrets
          cp deploy/observability/alerts.yml ci-prometheus/alerts.yml
          echo ci-token > ci-secrets/metrics_token
          docker run --rm \
            -v "$PWD:/work" \
            -v "$PWD/ci-prometheus:/etc/prometheus" \
            -v "$PWD/ci-secrets:/run/secrets" \
            -w /work --entrypoint promtool \
            prom/prometheus:v2.55.1 check rules deploy/observability/alerts.yml
          docker run --rm \
            -v "$PWD:/work" \
            -v "$PWD/ci-prometheus:/etc/prometheus" \
            -v "$PWD/ci-secrets:/run/secrets" \
            -w /work --entrypoint promtool \
            prom/prometheus:v2.55.1 check config deploy/observability/prometheus.yml

  yaml-lint:
    name: Workflow hygiene (YAML, pins, shell syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A broken action.yml is invisible until a customer's workflow fails on it, so parse it here.
      # Uses the runner's preinstalled python3 + PyYAML — no third-party action, nothing to pin.
      - name: Parse every workflow and action.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, sys, yaml

          files = sorted(pathlib.Path('.github/workflows').glob('*.y*ml'))
          files.append(pathlib.Path('action.yml'))

          failed = False
          for f in files:
              try:
                  yaml.safe_load(f.read_text())
                  print(f'ok   {f}')
              except yaml.YAMLError as e:
                  print(f'FAIL {f}: {e}')
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      # -------------------------------------------------------------------------------------
      # Three rules that were previously enforced by a reviewer noticing, which is not
      # enforcement. Each one is here because it was violated at least once.
      #
      #   1. Every third-party `uses:` is a 40-hex SHA. A tag is a mutable pointer its owner can
      #      move to any commit, so `@v5` executes unaudited code with this job's secrets. This
      #      also covers docs/ci.md, because the snippet we hand customers is the one that ends
      #      up in their repos.
      #   2. No `run:` block is syntactically broken. `bash -n` parses without executing, which
      #      catches an unterminated heredoc or quote before a customer's job does.
      #   3. No floating npm dist-tag in action.yml. The CLI process holds MFARM_API_KEY and
      #      derives MFARM_WEBDRIVER_URL from it, so `@latest` means an unreviewed publish runs
      #      with the customer's credential on their next CI run.
      # -------------------------------------------------------------------------------------
      - name: Check pins, shell syntax and dependency versions
        run: |
          set -euo pipefail
          python3 .github/scripts/check-workflow-hygiene.py

  package:
    name: The npm tarball installs and runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `@mfarm/cli` is the only published artifact in this repo, and everything that can break about
    # it breaks BETWEEN the source and the tarball: a `files` list that omits the entry point, a
    # `bin` path pointing at the pre-build layout, an import specifier that still says `.ts`, a
    # shebang asking for a flag the customer's Node does not have. None of that is visible to `npm
    # test`, which runs the TypeScript in place.
    #
    # This is the same class of gap that let PR #72 pass CI and fail Release: the thing shipped is
    # not the thing tested. Here the fix is cheap — no image build, just pack and install.
    strategy:
      fail-fast: false
      matrix:
        # 20.3.0 is not a round number, it is the EXACT floor `apps/cli/src/engine.ts` claims
        # (`AbortSignal.any`). Testing on 20.x-latest would prove nothing about the boundary; if the
        # floor is wrong, this is the job that says so.
        node: ['20.3.0', '22', '24']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # The BUILD is ours and uses our toolchain, exactly as a real publish would — `prepack` needs
      # the repo's pinned typescript. What has to happen the way a stranger does it is the step
      # after this one: installing the tarball somewhere with no workspace, no lockfile and none of
      # our devDependencies.
      #
      # `--ignore-scripts` because nothing here needs a dependency's postinstall, and skipping them
      # keeps this job from executing third-party install hooks it has no reason to run.
      - name: Install the build toolchain
        run: npm ci --ignore-scripts

      - name: Build and pack
        working-directory: apps/cli
        run: npm pack --pack-destination "${RUNNER_TEMP}"

      - name: The tarball contains a runnable program
        working-directory: apps/cli
        run: |
          set -euo pipefail

          # The shebang must not ask for type stripping: `dist/` is JavaScript, and an unknown flag
          # is a startup failure rather than a warning on the Nodes that do not accept it.
          head -1 dist/bin.js | grep -qx '#!/usr/bin/env node' || {
            echo "::error title=Wrong shebang::dist/bin.js must start with '#!/usr/bin/env node', got: $(head -1 dist/bin.js)"
            exit 1
          }

          # A surviving `.ts` specifier means javascript importing typescript that was never shipped
          # — an install that fails on first run with ERR_MODULE_NOT_FOUND.
          #
          # `--include='*.js'` is load-bearing, and it is here because the obvious version of this
          # check was WRONG. `inlineSources` embeds the original TypeScript inside the .map files, so
          # a recursive grep over dist/ matches `from './client.ts'` in the SOURCEMAP — source that is
          # supposed to say that — and fails a package with nothing whatsoever wrong with it. Only the
          # emitted JavaScript is being asserted about here.
          if grep -rn --include='*.js' "from ['\"]\..*\.ts['\"]" dist/; then
            echo "::error title=Unrewritten import::dist/ still imports .ts files; check rewriteRelativeImportExtensions in tsconfig.build.json."
            exit 1
          fi

      - name: Install it as a stranger would, and run it
        run: |
          set -euo pipefail
          expected="$(node -p "require('${GITHUB_WORKSPACE}/apps/cli/package.json').version")"
          tarball="$(ls "${RUNNER_TEMP}"/mfarm-cli-*.tgz)"

          mkdir -p "${RUNNER_TEMP}/consumer"
          cd "${RUNNER_TEMP}/consumer"
          npm init -y > /dev/null
          npm install "${tarball}"

          # `--version` is the whole chain in one call: the bin path resolves, the shebang runs, the
          # rewritten specifiers load, and `../package.json` resolves to OURS rather than the
          # consumer's — the failure that would otherwise report the stranger's version as mfarm's.
          got="$(./node_modules/.bin/mfarm --version)"
          echo "mfarm --version -> ${got} (expected ${expected}) on node $(node --version)"
          [ "${got}" = "${expected}" ] || {
            echo "::error title=Wrong version::the installed CLI reports '${got}', package.json says '${expected}'"
            exit 1
          }

          # Help must work without an API key. It is the first thing anyone runs.
          ./node_modules/.bin/mfarm --help > /dev/null

  published-cli:
    name: The version action.yml pins is really on npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # `action.yml` pins the CLI version deliberately and never uses a floating dist-tag, for the
      # reason recorded beside it: the process holds MFARM_API_KEY, so a moving tag means an
      # unreviewed publish runs with the customer's credential. The cost of pinning is that the pin
      # can name a version nobody ever published — and NOTHING else in this repo would notice,
      # because every other CLI test points MFARM_CLI_BIN at the checkout and never touches npm.
      # That is precisely the gap that made the action fail at step one for a year.
      #
      # What this does NOT cover: the action's own argument handling, which `action-test.yml`
      # already covers thoroughly against the checkout. This asserts one thing — the pinned version
      # resolves and runs — and it is the one thing only the real registry can answer.
      - name: Resolve the pinned version from npm and run it
        run: |
          set -euo pipefail

          # Read the pin out of action.yml rather than restating it here; a copy would drift and
          # then this job would cheerfully verify the wrong version.
          version="$(python3 - <<'PY'
          import re, sys, pathlib
          text = pathlib.Path('action.yml').read_text()
          m = re.search(r'@mfarm/cli@\$\{MFARM_CLI_VERSION:-([0-9][^}"\s]*)\}', text)
          if not m:
              sys.exit('could not find the pinned @mfarm/cli version in action.yml')
          print(m.group(1))
          PY
          )"
          echo "action.yml pins @mfarm/cli@${version}"

          # RUN IT FROM OUTSIDE THE WORKSPACE, and this is the entire subtlety of the job.
          #
          # `apps/cli` in this checkout IS `@mfarm/cli` at this very version. Run npx from the repo
          # root and npm considers the request already satisfied by the local workspace, contacts no
          # registry at all, and then fails with `sh: 1: mfarm: not found` because nothing is linked
          # — in under a second, with no npm output. That looks exactly like "the published package
          # is broken" and is nothing of the kind. Reproduced in a container both ways before this
          # comment was written.
          #
          # A stranger is not standing inside our monorepo, so neither is this check.
          cd "${RUNNER_TEMP}"
          got="$(npx --yes --package "@mfarm/cli@${version}" mfarm --version)"
          echo "npm resolved it from ${PWD} and it reports ${got}"
          [ "${got}" = "${version}" ] || {
            echo "::error title=Pin mismatch::action.yml pins ${version}, but that package reports ${got}"
            exit 1
          }
